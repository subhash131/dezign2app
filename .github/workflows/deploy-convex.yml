name: Deploy Convex

on:
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
      - 'packages/canvas/**'
      - '.github/workflows/deploy-convex.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'dezign2app/dezign2app-prod' || github.repository == 'subhash131/dezign2app'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL || vars.CONVEX_SITE_URL }}
          CONVEX_URL: ${{ secrets.CONVEX_URL || vars.CONVEX_URL }}
        run: pnpm exec convex deploy
